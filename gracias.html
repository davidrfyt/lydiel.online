<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mensaje enviado — Lydiel</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="lydiel.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css?v=5">
<style>
  .thanks{min-height:62vh;display:grid;align-content:center;padding:80px 0}
  .thanks h1{font-family:var(--display);font-weight:300;font-size:var(--f-2xl);line-height:1.1;letter-spacing:-.015em;margin:0 0 18px;max-width:16ch}
  .thanks p{color:var(--ink-2);max-width:46ch;margin:0 0 30px}
  .back{font-family:var(--mono);font-size:var(--f-xs);letter-spacing:.12em;text-transform:uppercase;text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:3px}
  .back:hover{border-bottom-color:var(--ink)}
</style>
</head>
<body>

<header class="top">
  <div class="shell">
    <a class="wordmark" href="/">Lydiel</a>
    <nav>
      <a href="/#practica">Práctica</a>
      <a href="/#trabajo">Trabajo</a>
      <a href="/#contacto">Contacto</a>
    </nav>
  </div>
</header>

<main class="shell">
  <div class="thanks rise">
    <span class="status" style="display:inline-flex;align-items:center;gap:9px;margin-bottom:24px;font-family:var(--mono);font-size:var(--f-micro);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)">Mensaje recibido</span>
    <h1>Gracias. Te respondo pronto.</h1>
    <p>Tu mensaje ya está en mi correo. Suelo contestar en menos de veinticuatro horas; si es urgente, escríbeme directamente a <a href="mailto:webmaster@labcore.es" style="color:inherit">webmaster@labcore.es</a>.</p>
    <span><a class="back" href="/">Volver al inicio</a></span>
  </div>
</main>

<footer>
  <div class="shell">
    <span>&copy; 2026 Lydiel</span>
  </div>
</footer>

</body>
</html>
